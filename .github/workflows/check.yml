name: Luau and Rojo checks
# Branch pushes are covered by their pull request run, so push runs only on main.
on:
  push:
    branches: [main]
  pull_request:
# A newer commit on the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test RTBF dry-run and deletion helper
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build pinned Luau tools
        run: |
          git clone https://github.com/luau-lang/luau.git "$RUNNER_TEMP/luau"
          git -C "$RUNNER_TEMP/luau" checkout 32c28089305f488f901aaf1dbf3fd1cb65fa3d11
          make -C "$RUNNER_TEMP/luau" config=release luau luau-compile -j2
          echo "$RUNNER_TEMP/luau/build/release" >> "$GITHUB_PATH"
      - name: Compile and run regression checks
        run: |
          python3 scripts/check.py
          python3 scripts/check_ui_icons.py
          python3 scripts/check_golem_service.py
          python3 scripts/check_enemy_service.py
          python3 scripts/check_mining_service.py
      - name: Verify original assets are reproducible
        run: |
          python3 scripts/create_assets.py
          git diff --exit-code -- assets/models assets/audio
      - name: Build with Rojo 7.6.1
        env:
          ROJO_SHA256: a9542a713036897fdbd0173e7a105ea409658333133c949025fcb6f1a7ca909d
        run: |
          rojo_zip="$RUNNER_TEMP/rojo-7.6.1-linux-x86_64.zip"
          curl -fsSL -H "Accept: application/octet-stream" \
            https://api.github.com/repos/rojo-rbx/rojo/releases/assets/313571919 \
            -o "$rojo_zip" || {
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
              https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-linux-x86_64.zip \
              -o "$rojo_zip"
          }
          echo "${ROJO_SHA256}  ${rojo_zip}" | sha256sum -c -
          unzip "$rojo_zip" -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"
          "$RUNNER_TEMP/rojo/rojo" build default.project.json -o "$RUNNER_TEMP/grow-a-golem.rbxlx"

  # Style, lint and Roblox type checks. Versions are pinned; bump them together.
  lint:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ROJO: 7.6.1
      STYLUA: 2.6.0
      SELENE: 0.32.0
      LUAU_LSP_VERSION: 1.70.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned lint tool binaries
        uses: actions/cache@v4
        id: lint-tools-cache
        with:
          path: ${{ runner.temp }}/ci-lint-tools
          key: ci-lint-tools-rojo-${{ env.ROJO }}-stylua-${{ env.STYLUA }}-selene-${{ env.SELENE }}-luau-lsp-${{ env.LUAU_LSP_VERSION }}
      - name: Install Rojo, StyLua, selene and luau-lsp
        if: steps.lint-tools-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci_install_lint_tools.sh
      - name: Use lint tools
        run: |
          echo "${RUNNER_TEMP}/ci-lint-tools/bin" >> "$GITHUB_PATH"
          echo "GLOBAL_TYPES_PATH=${RUNNER_TEMP}/ci-lint-tools/globalTypes.d.luau" >> "$GITHUB_ENV"
          test -x "${RUNNER_TEMP}/ci-lint-tools/bin/rojo"
          test -s "${RUNNER_TEMP}/ci-lint-tools/globalTypes.d.luau"
          rojo --version
          stylua --version
          selene --version
          luau-lsp --version
      - name: StyLua format check (files in .styluaignore are not formatted yet)
        run: stylua --check src tests
      - name: selene lint (errors fail, warnings are shown)
        run: selene --allow-warnings src
      - name: luau-lsp type check against scripts/type-baseline.json
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          python3 scripts/typecheck.py --definitions "$GLOBAL_TYPES_PATH"
